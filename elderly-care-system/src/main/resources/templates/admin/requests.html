<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Service Requests')}"></head>
<body>
<div class="dashboard-layout">
    <aside th:replace="~{fragments/admin-sidebar :: sidebar}"></aside>
    <main class="main-content">
        <div class="topbar"><h1>Service Requests</h1></div>
        <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
        <div class="table-wrap">
            <table>
                <thead><tr><th>ID</th><th>Elderly</th><th>Service</th><th>Date</th><th>Location</th><th>Status</th><th>Actions</th></tr></thead>
                <tbody>
                <tr th:each="r : ${requests}">
                    <td th:text="${r.id}"></td>
                    <td th:text="${r.elderlyUser.fullName}"></td>
                    <td th:text="${r.service.name}"></td>
                    <td th:text="${r.preferredDate}"></td>
                    <td th:text="${r.location}"></td>
                    <td><span class="badge" th:classappend="'badge-' + ${#strings.toLowerCase(r.status.name())}" th:text="${r.status}"></span></td>
                    <td>
                        <form th:if="${r.status.name() == 'PENDING'}" th:action="@{/admin/requests/{id}/approve(id=${r.id})}" method="post" style="display:inline;">
                            <button class="btn btn-success btn-sm">Approve</button>
                        </form>
                        <form th:if="${r.status.name() == 'PENDING'}" th:action="@{/admin/requests/{id}/reject(id=${r.id})}" method="post" style="display:inline;">
                            <button class="btn btn-danger btn-sm">Reject</button>
                        </form>
                        <div th:if="${r.status.name() == 'APPROVED' or r.status.name() == 'PENDING'}" style="margin-top:0.4rem;">
                            <form th:action="@{/admin/requests/{id}/assign(id=${r.id})}" method="post" style="display:flex;gap:0.4rem;flex-wrap:wrap;align-items:center;">
                                <select name="caregiverId" class="form-control" style="width:auto;padding:0.3rem;" required>
                                    <option value="">Select caregiver</option>
                                    <option th:each="c : ${caregivers}" th:value="${c.user.id}" th:text="${c.user.fullName}"></option>
                                </select>
                                <input type="date" name="scheduledDate" class="form-control" style="width:auto;padding:0.3rem;" required>
                                <input type="time" name="scheduledTime" class="form-control" style="width:auto;padding:0.3rem;" required>
                                <button class="btn btn-primary btn-sm">Assign</button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
</body>
</html>
