<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Care Reports')}"></head>
<body>
<div class="dashboard-layout">
    <aside th:replace="~{fragments/admin-sidebar :: sidebar}"></aside>
    <main class="main-content">
        <div class="topbar"><h1>Care Progress Monitoring</h1></div>
        <div th:each="r : ${reports}" class="card mb-2">
            <div style="display:flex;justify-content:space-between;">
                <strong th:text="${r.visitDate} + ' · ' + ${r.elderlyUser.fullName}"></strong>
                <span style="color:var(--text-muted);" th:text="${r.caregiver.fullName}"></span>
            </div>
            <p style="margin-top:0.5rem;"><strong>Completed:</strong> <span th:text="${r.completedActivities}"></span></p>
            <p th:if="${r.healthObservations}"><strong>Observations:</strong> <span th:text="${r.healthObservations}"></span></p>
            <p th:if="${r.remarks}"><strong>Remarks:</strong> <span th:text="${r.remarks}"></span></p>
        </div>
        <div th:if="${#lists.isEmpty(reports)}" class="card empty-state"><p>No care reports yet.</p></div>
    </main>
</div>
</body>
</html>
