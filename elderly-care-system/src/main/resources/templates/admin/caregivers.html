<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Manage Caregivers')}"></head>
<body>
<div class="dashboard-layout">
    <aside th:replace="~{fragments/admin-sidebar :: sidebar}"></aside>
    <main class="main-content">
        <div class="topbar"><h1>Manage Caregivers</h1></div>
        <div class="table-wrap">
            <table>
                <thead><tr><th>Name</th><th>Qualifications</th><th>Experience</th><th>Skills</th><th>Status</th></tr></thead>
                <tbody>
                <tr th:each="c : ${caregivers}">
                    <td th:text="${c.user.fullName}"></td>
                    <td th:text="${c.qualifications}"></td>
                    <td th:text="${c.yearsOfExperience} + ' yrs'"></td>
                    <td th:text="${c.skills}"></td>
                    <td><span class="badge" th:classappend="'badge-' + ${#strings.toLowerCase(c.verificationStatus.name())}" th:text="${c.verificationStatus}"></span></td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
</body>
</html>
