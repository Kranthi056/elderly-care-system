<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Notifications')}"></head>
<body>
<div class="dashboard-layout">
    <aside th:replace="~{fragments/admin-sidebar :: sidebar}"></aside>
    <main class="main-content">
        <div class="topbar"><h1>Notifications</h1></div>
        <div th:each="n : ${notifications}" class="card mb-2">
            <strong th:text="${n.title}"></strong>
            <p style="color:var(--text-muted);" th:text="${n.message}"></p>
            <small th:text="${#temporals.format(n.createdAt, 'dd MMM yyyy HH:mm')}"></small>
        </div>
        <div th:if="${#lists.isEmpty(notifications)}" class="card empty-state"><p>No notifications.</p></div>
    </main>
</div>
</body>
</html>
