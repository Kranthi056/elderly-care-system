<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Progress Reports')}"></head>
<body>
<div class="dashboard-layout">
    <aside th:replace="~{fragments/elderly-sidebar :: sidebar}"></aside>
    <main class="main-content">
        <div class="topbar"><h1>Care Progress Reports</h1></div>
        <div th:if="${#lists.isEmpty(reports)}" class="card empty-state"><i class="fas fa-file-medical"></i><p>No reports yet.</p></div>
        <div th:each="r : ${reports}" class="card mb-2">
            <div style="display:flex;justify-content:space-between;margin-bottom:0.8rem;">
                <strong th:text="${r.visitDate}"></strong>
                <span style="color:var(--text-muted);" th:text="${r.caregiver.fullName}"></span>
            </div>
            <p><strong>Completed:</strong> <span th:text="${r.completedActivities}"></span></p>
            <p th:if="${r.pendingActivities}"><strong>Pending:</strong> <span th:text="${r.pendingActivities}"></span></p>
            <p th:if="${r.healthObservations}"><strong>Observations:</strong> <span th:text="${r.healthObservations}"></span></p>
            <p th:if="${r.remarks}"><strong>Remarks:</strong> <span th:text="${r.remarks}"></span></p>
        </div>
    </main>
</div>
</body>
</html>
