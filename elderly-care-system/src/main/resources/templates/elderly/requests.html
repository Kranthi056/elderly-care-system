<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('My Service Requests')}"></head>
<body>
<div class="dashboard-layout">
    <aside th:replace="~{fragments/elderly-sidebar :: sidebar}"></aside>
    <main class="main-content">
        <div class="topbar">
            <h1>My Service Requests</h1>
            <a th:href="@{/elderly/request}" class="btn btn-primary btn-sm"><i class="fas fa-plus"></i> New Request</a>
        </div>
        <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
        <div class="table-wrap">
            <table>
                <thead>
                <tr><th>ID</th><th>Service</th><th>Date</th><th>Time</th><th>Status</th><th>Actions</th></tr>
                </thead>
                <tbody>
                <tr th:each="r : ${requests}">
                    <td th:text="${r.id}"></td>
                    <td th:text="${r.service.name}"></td>
                    <td th:text="${r.preferredDate}"></td>
                    <td th:text="${r.preferredTime}"></td>
                    <td><span class="badge" th:classappend="'badge-' + ${#strings.toLowerCase(r.status.name())}" th:text="${r.status}"></span></td>
                    <td>
                        <form th:if="${r.status.name() == 'PENDING' or r.status.name() == 'APPROVED'}"
                              th:action="@{/elderly/requests/{id}/cancel(id=${r.id})}" method="post" style="display:inline;">
                            <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('Cancel this request?')">Cancel</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(requests)}"><td colspan="6" class="text-center" style="padding:2rem;color:var(--text-muted);">No requests found.</td></tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
</body>
</html>
