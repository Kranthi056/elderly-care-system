<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Feedback')}"></head>
<body>
<div class="dashboard-layout">
    <aside th:replace="~{fragments/elderly-sidebar :: sidebar}"></aside>
    <main class="main-content">
        <div class="topbar">
            <div>
                <h1>Feedback & Reviews</h1>
                <div class="breadcrumb">Share your experience to help us improve care</div>
            </div>
        </div>
        <div th:if="${message}" class="alert alert-success"><i class="fas fa-check-circle"></i> <span th:text="${message}"></span></div>
        <div class="card" style="max-width:560px;">
            <h3 style="margin-bottom:1.2rem;">Rate Your Care Experience</h3>
            <form th:action="@{/elderly/feedback}" method="post">
                <div class="form-group">
                    <label class="required">Rating</label>
                    <select name="rating" class="form-control" required>
                        <option value="">Select rating...</option>
                        <option value="5">★★★★★ Excellent</option>
                        <option value="4">★★★★☆ Very Good</option>
                        <option value="3">★★★☆☆ Good</option>
                        <option value="2">★★☆☆☆ Fair</option>
                        <option value="1">★☆☆☆☆ Poor</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Comments</label>
                    <textarea name="comments" class="form-control" placeholder="What went well? What could be improved?"></textarea>
                </div>
                <button type="submit" class="btn btn-primary"><i class="fas fa-star"></i> Submit Feedback</button>
            </form>
        </div>
        <div class="card mt-3" style="max-width:560px;background:var(--primary-light);border:1px solid rgba(42,157,143,0.2);">
            <p><strong>Your voice matters.</strong> Honest feedback helps caregivers improve and helps other families choose the right support.</p>
        </div>
    </main>
</div>
</body>
</html>
