<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Medical Information')}"></head>
<body>
<div class="dashboard-layout">
    <aside th:replace="~{fragments/elderly-sidebar :: sidebar}"></aside>
    <main class="main-content">
        <div class="topbar"><h1>Medical Information</h1></div>
        <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
        <div class="card" style="max-width:700px;">
            <form th:action="@{/elderly/medical}" method="post">
                <div class="form-group"><label>Medical History</label><textarea name="medicalHistory" class="form-control" th:text="${profile.medicalHistory}"></textarea></div>
                <div class="form-group"><label>Health Conditions</label><textarea name="healthConditions" class="form-control" th:text="${profile.healthConditions}"></textarea></div>
                <div class="form-group"><label>Allergies</label><input type="text" name="allergies" class="form-control" th:value="${profile.allergies}"></div>
                <div class="form-group"><label>Current Medications</label><textarea name="currentMedications" class="form-control" th:text="${profile.currentMedications}"></textarea></div>
                <div class="form-group"><label>Care Preferences</label><textarea name="carePreferences" class="form-control" th:text="${profile.carePreferences}"></textarea></div>
                <div class="btn-group">
                    <button type="submit" class="btn btn-primary">Save</button>
                    <a th:href="@{/elderly/dashboard}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </main>
</div>
</body>
</html>
