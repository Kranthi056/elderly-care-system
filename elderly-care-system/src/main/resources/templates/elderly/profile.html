<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('My Profile')}"></head>
<body>
<div class="dashboard-layout">
    <aside th:replace="~{fragments/elderly-sidebar :: sidebar}"></aside>
    <main class="main-content">
        <div class="topbar"><h1>My Profile</h1></div>
        <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
        <div class="card" style="max-width:700px;">
            <form th:action="@{/elderly/profile}" method="post">
                <div class="form-row">
                    <div class="form-group"><label>Full Name</label><input type="text" name="fullName" class="form-control" th:value="${user.fullName}"></div>
                    <div class="form-group"><label>Email</label><input type="email" class="form-control" th:value="${user.email}" disabled></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>Phone</label><input type="tel" name="phone" class="form-control" th:value="${user.phone}"></div>
                    <div class="form-group"><label>Gender</label>
                        <select name="gender" class="form-control">
                            <option value="">Select</option>
                            <option value="Female" th:selected="${profile.gender == 'Female'}">Female</option>
                            <option value="Male" th:selected="${profile.gender == 'Male'}">Male</option>
                            <option value="Other" th:selected="${profile.gender == 'Other'}">Other</option>
                        </select>
                    </div>
                </div>
                <div class="form-group"><label>Address</label><input type="text" name="address" class="form-control" th:value="${user.address}"></div>
                <div class="form-row">
                    <div class="form-group"><label>City</label><input type="text" name="city" class="form-control" th:value="${user.city}"></div>
                    <div class="form-group"><label>State</label><input type="text" name="state" class="form-control" th:value="${user.state}"></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>Emergency Contact</label><input type="text" name="emergencyContactName" class="form-control" th:value="${profile.emergencyContactName}"></div>
                    <div class="form-group"><label>Emergency Phone</label><input type="tel" name="emergencyContactPhone" class="form-control" th:value="${profile.emergencyContactPhone}"></div>
                </div>
                <div class="form-group"><label>Relation</label><input type="text" name="emergencyContactRelation" class="form-control" th:value="${profile.emergencyContactRelation}"></div>
                <div class="btn-group">
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                    <a th:href="@{/elderly/dashboard}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </main>
</div>
</body>
</html>
