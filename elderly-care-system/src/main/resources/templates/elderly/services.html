<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Care Services')}"></head>
<body>
<div class="dashboard-layout">
    <aside th:replace="~{fragments/elderly-sidebar :: sidebar}"></aside>
    <main class="main-content">
        <div class="topbar"><h1>Care Services</h1></div>
        <div class="grid-3">
            <div class="card card-3d service-card" th:each="s : ${services}">
                <div class="icon-wrap"><i th:class="'fas ' + ${s.iconClass}"></i></div>
                <h3 th:text="${s.name}"></h3>
                <p th:text="${s.description}"></p>
                <a th:href="@{/elderly/request}" class="btn btn-primary btn-sm">Request Service</a>
            </div>
        </div>
    </main>
</div>
</body>
</html>
