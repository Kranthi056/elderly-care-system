<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('My Caregiver')}"></head>
<body>
<div class="dashboard-layout">
    <aside th:replace="~{fragments/elderly-sidebar :: sidebar}"></aside>
    <main class="main-content">
        <div class="topbar"><h1>My Caregiver</h1></div>
        <div th:if="${assignment == null}" class="card empty-state">
            <i class="fas fa-user-nurse"></i>
            <p>No caregiver currently assigned.</p>
            <a th:href="@{/elderly/request}" class="btn btn-primary btn-sm mt-2">Request a Service</a>
        </div>
        <div th:if="${assignment != null}" class="card" style="max-width:600px;">
            <div style="display:flex;align-items:center;gap:1.5rem;margin-bottom:1.5rem;">
                <div style="width:80px;height:80px;border-radius:50%;background:var(--primary-light);display:flex;align-items:center;justify-content:center;font-size:2rem;color:var(--primary);">
                    <i class="fas fa-user-nurse"></i>
                </div>
                <div>
                    <h2 th:text="${assignment.caregiver.fullName}"></h2>
                    <p style="color:var(--text-muted);" th:if="${caregiverProfile}" th:text="${caregiverProfile.qualifications}"></p>
                </div>
            </div>
            <div th:if="${caregiverProfile}">
                <p><strong>Experience:</strong> <span th:text="${caregiverProfile.yearsOfExperience}"></span> years</p>
                <p><strong>Skills:</strong> <span th:text="${caregiverProfile.skills}"></span></p>
                <p><strong>Rating:</strong> <span th:text="${caregiverProfile.averageRating}"></span> ★</p>
                <p><strong>Service:</strong> <span th:text="${assignment.serviceRequest.service.name}"></span></p>
                <p><strong>Scheduled:</strong> <span th:text="${assignment.scheduledDate} + ' at ' + ${assignment.scheduledTime}"></span></p>
            </div>
        </div>
    </main>
</div>
</body>
</html>
