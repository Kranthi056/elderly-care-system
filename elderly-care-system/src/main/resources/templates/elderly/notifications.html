<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Notifications')}"></head>
<body>
<div class="dashboard-layout">
    <aside th:replace="~{fragments/elderly-sidebar :: sidebar}"></aside>
    <main class="main-content">
        <div class="topbar"><h1>Notifications</h1></div>
        <div th:if="${#lists.isEmpty(notifications)}" class="card empty-state"><i class="fas fa-bell"></i><p>No notifications.</p></div>
        <div th:each="n : ${notifications}" class="card mb-2" style="display:flex;gap:1rem;align-items:flex-start;">
            <i class="fas fa-info-circle" style="color:var(--primary);font-size:1.3rem;margin-top:0.2rem;"></i>
            <div>
                <strong th:text="${n.title}"></strong>
                <p style="color:var(--text-muted);margin-top:0.2rem;" th:text="${n.message}"></p>
                <small style="color:var(--text-muted);" th:text="${#temporals.format(n.createdAt, 'dd MMM yyyy HH:mm')}"></small>
            </div>
        </div>
    </main>
</div>
</body>
</html>
