<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Request a Service')}"></head>
<body>
<div class="dashboard-layout">
    <aside th:replace="~{fragments/elderly-sidebar :: sidebar}"></aside>
    <main class="main-content">
        <div class="topbar"><h1>Request a Service</h1></div>
        <div class="card" style="max-width:640px;">
            <form th:action="@{/elderly/request}" method="post">
                <div class="form-group">
                    <label class="required">Select Service</label>
                    <select name="serviceId" class="form-control" required>
                        <option value="">Choose a service...</option>
                        <option th:each="s : ${services}" th:value="${s.id}" th:text="${s.name}"></option>
                    </select>
                </div>
                <div class="form-group"><label class="required">Description</label><textarea name="description" class="form-control" required placeholder="Describe your needs..."></textarea></div>
                <div class="form-row">
                    <div class="form-group"><label class="required">Preferred Date</label><input type="date" name="preferredDate" class="form-control" required></div>
                    <div class="form-group"><label class="required">Preferred Time</label><input type="time" name="preferredTime" class="form-control" required></div>
                </div>
                <div class="form-group"><label class="required">Location</label><input type="text" name="location" class="form-control" required placeholder="Full address"></div>
                <div class="form-group"><label>Additional Requirements</label><textarea name="additionalRequirements" class="form-control"></textarea></div>
                <div class="btn-group">
                    <button type="submit" class="btn btn-primary">Submit Request</button>
                    <a th:href="@{/elderly/dashboard}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </main>
</div>
</body>
</html>
