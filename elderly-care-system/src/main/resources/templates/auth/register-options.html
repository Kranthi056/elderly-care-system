<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Register')}"></head>
<body>
<nav th:replace="~{fragments/layout :: public-nav}"></nav>
<section class="section">
    <h1 class="section-title">Join ElderCare</h1>
    <p class="section-subtitle">Choose how you would like to register</p>
    <div class="grid-3" style="max-width:800px;margin:0 auto;">
        <a th:href="@{/register/elderly}" class="card card-3d text-center" style="text-decoration:none;color:inherit;padding:2.5rem;">
            <i class="fas fa-user-friends" style="font-size:3rem;color:var(--primary);margin-bottom:1rem;"></i>
            <h3>Elderly / Family</h3>
            <p style="color:var(--text-muted);margin-top:0.5rem;">Register to request care services for yourself or a loved one.</p>
        </a>
        <a th:href="@{/register/caregiver}" class="card card-3d text-center" style="text-decoration:none;color:inherit;padding:2.5rem;">
            <i class="fas fa-user-nurse" style="font-size:3rem;color:var(--primary);margin-bottom:1rem;"></i>
            <h3>Caregiver</h3>
            <p style="color:var(--text-muted);margin-top:0.5rem;">Join as a professional caregiver and help those in need.</p>
        </a>
    </div>
</section>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
