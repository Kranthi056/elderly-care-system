<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('My Profile')}"></head>
<body>
<div class="dashboard-layout">
    <aside th:replace="~{fragments/caregiver-sidebar :: sidebar}"></aside>
    <main class="main-content">
        <div class="topbar"><h1>My Profile</h1></div>
        <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
        <div class="card" style="max-width:700px;">
            <form th:action="@{/caregiver/profile}" method="post">
                <div class="form-row">
                    <div class="form-group"><label>Full Name</label><input type="text" name="fullName" class="form-control" th:value="${user.fullName}"></div>
                    <div class="form-group"><label>Email</label><input type="email" class="form-control" th:value="${user.email}" disabled></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>Phone</label><input type="tel" name="phone" class="form-control" th:value="${user.phone}"></div>
                    <div class="form-group"><label>Years of Experience</label><input type="number" name="yearsOfExperience" class="form-control" th:value="${profile.yearsOfExperience}"></div>
                </div>
                <div class="form-group"><label>Qualifications</label><input type="text" name="qualifications" class="form-control" th:value="${profile.qualifications}"></div>
                <div class="form-group"><label>Skills</label><input type="text" name="skills" class="form-control" th:value="${profile.skills}"></div>
                <div class="form-group"><label>Service Locations</label><input type="text" name="serviceLocations" class="form-control" th:value="${profile.serviceLocations}"></div>
                <div class="form-group"><label>Availability</label><input type="text" name="availability" class="form-control" th:value="${profile.availability}"></div>
                <div class="form-group"><label>Hourly Rate ($)</label><input type="number" name="hourlyRate" step="0.01" class="form-control" th:value="${profile.hourlyRate}"></div>
                <button type="submit" class="btn btn-primary">Save Changes</button>
            </form>
        </div>
    </main>
</div>
</body>
</html>
