<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('My Assignments')}"></head>
<body>
<div class="dashboard-layout">
    <aside th:replace="~{fragments/caregiver-sidebar :: sidebar}"></aside>
    <main class="main-content">
        <div class="topbar"><h1>My Assignments</h1></div>
        <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
        <div class="table-wrap">
            <table>
                <thead><tr><th>Elderly</th><th>Service</th><th>Date</th><th>Time</th><th>Status</th><th>Actions</th></tr></thead>
                <tbody>
                <tr th:each="a : ${assignments}">
                    <td th:text="${a.elderlyUser.fullName}"></td>
                    <td th:text="${a.serviceRequest.service.name}"></td>
                    <td th:text="${a.scheduledDate}"></td>
                    <td th:text="${a.scheduledTime}"></td>
                    <td><span class="badge" th:classappend="'badge-' + ${#strings.toLowerCase(a.status.name())}" th:text="${a.status}"></span></td>
                    <td>
                        <a th:href="@{/caregiver/elderly/{id}(id=${a.elderlyUser.id})}" class="btn btn-secondary btn-sm">Details</a>
                        <form th:if="${a.status.name() == 'PENDING'}" th:action="@{/caregiver/assignments/{id}/accept(id=${a.id})}" method="post" style="display:inline;">
                            <button class="btn btn-success btn-sm">Accept</button>
                        </form>
                        <form th:if="${a.status.name() == 'PENDING'}" th:action="@{/caregiver/assignments/{id}/reject(id=${a.id})}" method="post" style="display:inline;">
                            <button class="btn btn-danger btn-sm" onclick="return confirm('Reject?')">Reject</button>
                        </form>
                        <form th:if="${a.status.name() == 'ACCEPTED'}" th:action="@{/caregiver/assignments/{id}/start(id=${a.id})}" method="post" style="display:inline;">
                            <button class="btn btn-primary btn-sm">Start Visit</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(assignments)}"><td colspan="6" class="text-center" style="padding:2rem;">No assignments.</td></tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
</body>
</html>
