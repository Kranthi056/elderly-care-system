<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Update Care Progress')}"></head>
<body>
<div class="dashboard-layout">
    <aside th:replace="~{fragments/caregiver-sidebar :: sidebar}"></aside>
    <main class="main-content">
        <div class="topbar"><h1>Update Care Progress</h1></div>
        <div class="card" style="max-width:640px;">
            <form th:action="@{/caregiver/report}" method="post">
                <div class="form-group">
                    <label class="required">Assignment</label>
                    <select name="assignmentId" class="form-control" required>
                        <option value="">Select assignment...</option>
                        <option th:each="a : ${assignments}" th:value="${a.id}"
                                th:text="${a.elderlyUser.fullName} + ' - ' + ${a.serviceRequest.service.name} + ' (' + ${a.scheduledDate} + ')'"></option>
                    </select>
                </div>
                <div class="form-row">
                    <div class="form-group"><label class="required">Visit Date</label><input type="date" name="visitDate" class="form-control" required></div>
                    <div class="form-group"><label class="required">Start Time</label><input type="time" name="startTime" class="form-control" required></div>
                </div>
                <div class="form-group"><label class="required">End Time</label><input type="time" name="endTime" class="form-control" required></div>
                <div class="form-group"><label class="required">Completed Activities</label><textarea name="completedActivities" class="form-control" required></textarea></div>
                <div class="form-group"><label>Pending Activities</label><textarea name="pendingActivities" class="form-control"></textarea></div>
                <div class="form-group"><label>Health Observations</label><textarea name="healthObservations" class="form-control"></textarea></div>
                <div class="form-group"><label>Remarks</label><textarea name="remarks" class="form-control"></textarea></div>
                <button type="submit" class="btn btn-primary">Submit Report</button>
            </form>
        </div>
    </main>
</div>
</body>
</html>
