<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Care Reports')}"></head>
<body>
<div class="dashboard-layout">
    <aside th:replace="~{fragments/caregiver-sidebar :: sidebar}"></aside>
    <main class="main-content">
        <div class="topbar"><h1>My Care Reports</h1></div>
        <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
        <div th:each="r : ${reports}" class="card mb-2">
            <strong th:text="${r.visitDate} + ' · ' + ${r.elderlyUser.fullName}"></strong>
            <p style="margin-top:0.5rem;"><strong>Completed:</strong> <span th:text="${r.completedActivities}"></span></p>
            <p th:if="${r.remarks}"><strong>Remarks:</strong> <span th:text="${r.remarks}"></span></p>
        </div>
        <div th:if="${#lists.isEmpty(reports)}" class="card empty-state"><p>No reports submitted yet.</p></div>
    </main>
</div>
</body>
</html>
