<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Schedule')}"></head>
<body>
<div class="dashboard-layout">
    <aside th:replace="~{fragments/caregiver-sidebar :: sidebar}"></aside>
    <main class="main-content">
        <div class="topbar"><h1>Care Schedule</h1></div>
        <div class="table-wrap">
            <table>
                <thead><tr><th>Date</th><th>Time</th><th>Elderly</th><th>Service</th><th>Status</th></tr></thead>
                <tbody>
                <tr th:each="a : ${assignments}">
                    <td th:text="${a.scheduledDate}"></td>
                    <td th:text="${a.scheduledTime}"></td>
                    <td th:text="${a.elderlyUser.fullName}"></td>
                    <td th:text="${a.serviceRequest.service.name}"></td>
                    <td><span class="badge" th:classappend="'badge-' + ${#strings.toLowerCase(a.status.name())}" th:text="${a.status}"></span></td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
</body>
</html>
